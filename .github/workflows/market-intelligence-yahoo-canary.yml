name: Market Intelligence Yahoo Canary

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intelligence-yahoo-canary
  cancel-in-progress: true

jobs:
  yahoo-contract:
    name: Read-only Yahoo contract check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_MARKET_INTELLIGENCE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-runtime.txt
            backend/requirements-test.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-runtime.txt -r backend/requirements-test.txt

      - name: Run read-only Yahoo contract canary
        working-directory: backend
        run: >-
          python -m pytest
          tests/integration/market_intelligence/test_live_yahoo_validation.py
          -q
