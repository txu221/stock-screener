[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    error::FutureWarning
markers =
    integration: marks tests as integration tests (require running server)
    live_service: marks tests that require an explicitly started live backend and external services
    postgresql_integration: marks opt-in tests that require a real PostgreSQL server
    redis_integration: marks opt-in tests that require a real Redis server
    celery_integration: marks opt-in tests that require a real Redis-backed Celery worker
    live_provider: marks opt-in tests that call a live external market-data provider
    manual_provider: marks provider validation that is never part of deterministic CI
    slow: marks tests as slow running tests
    performance: marks tests as query performance benchmarks
    load: marks tests as per-market load/soak benchmarks (require Redis; opt-in via gate-6-load)
    allow_real_celery_dispatch: allows a unit test to exercise Celery's real apply_async path
